# Build the package website and publish it to the gh-pages branch, from which
# GitHub Pages serves it (https://rpahl.github.io/pubflow/). It runs on every push to main
# and on demand from the Actions tab.
# Based on https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown.yaml

concurrency:
  group: pkgdown
  cancel-in-progress: false

permissions: read-all

jobs:
  pkgdown:
    name: Build and deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TZ: UTC
      LANG: C.UTF-8
      # renv manages the local development library only
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.13'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Configure git
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # pkgdown switches back to the current branch after deploying
          git switch --create "pkgdown-$GITHUB_RUN_ID"

      # pkgdown turns every top-level *.md file (and those in .github/) into a
      # page, without an option to exclude them. Drop the agent instructions on
      # the throw-away branch above; committing keeps them out for the whole run.
      - name: Keep internal files out of the site
        run: |
          git rm --quiet AGENTS.md CLAUDE.md .github/copilot-instructions.md
          git commit --quiet -m "Drop internal files from the site build"

      - name: Build and deploy site
        shell: Rscript {0}
        run: pkgdown::deploy_to_branch(new_process = FALSE)
