# R CMD check on Ubuntu with the development version of R (4.5.3), the
# current R release and the oldest supported version (4.3.2), with pandoc
# 3.13; one more job checks the oldest supported pandoc (3.6).
# Based on https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # jobs without a pandoc of their own keep their names (required checks of main)
    name: >-
      ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.pandoc
      && format(', pandoc {0}', matrix.config.pandoc) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: '4.5.3'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: '4.3.2'}
          - {os: ubuntu-latest, r: 'release', pandoc: '3.6'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # run the snapshot tests, which testthat skips "on CRAN"
      NOT_CRAN: true
      # renv manages the local development library only; on CI the
      # dependencies are installed with pak from DESCRIPTION.
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ matrix.config.pandoc || '3.13' }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
