# lintr with the configuration in .lintr; fails on any lint.
# Based on https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # renv manages the local development library only; on CI the
      # dependencies are installed with pak from DESCRIPTION.
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::pkgload, local::.
          needs: lint

      # Same command as in AGENTS.md: the package loaded (so lintr resolves
      # functions defined in other files), without the test helpers and
      # without testthat attached (top-level test code must not need them)
      - name: Lint
        run: |
          pkgload::load_all(quiet = TRUE, helpers = FALSE,
                            attach_testthat = FALSE)
          lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
